steps:
  # Create the .env file
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "MAPBOX_ACCESS_TOKEN=${_MAPBOX_ACCESS_TOKEN}" > .env.production && \
        echo "GOOGLE_MAPS_API_KEY=${_GOOGLE_MAPS_API_KEY}" >> .env.production && \
        echo "GOOGLE_ANALYTICS_ID=G-51PR3WELRH" >> .env.production && \
        echo "GOOGLE_TAG_MANAGER_ID=GTM-M5P4RNP7" >> .env.production && \
        echo "HOTJAR_ID=5305073" >> .env.production && \
        echo "API_URL=${_API_URL}" >> .env.production
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/mulher-rio:$COMMIT_SHA", "."]
  # Push the container image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/mulher-rio:$COMMIT_SHA"]
  # Kustomize: set the image in the kustomization.yaml file
  - name: "gcr.io/cloud-builders/gke-deploy"
    dir: "k8s/prod"
    entrypoint: "kustomize"
    args:
      - "edit"
      - "set"
      - "image"
      - "gcr.io/project-id/mulher-rio=gcr.io/$PROJECT_ID/mulher-rio:$COMMIT_SHA"
  # Kustomize: apply the kustomization.yaml file
  - name: "gcr.io/cloud-builders/gke-deploy"
    dir: "k8s/prod"
    entrypoint: "kustomize"
    args: ["build", ".", "-o", "prod.yaml"]
  # Deploy the application to the GKE cluster
  - name: "gcr.io/cloud-builders/gke-deploy"
    dir: "k8s/prod"
    args:
      - "run"
      - "--filename=prod.yaml"
      - "--location=us-central1"
      - "--cluster=datario"
      - "--project=datario"

images:
  - "gcr.io/$PROJECT_ID/mulher-rio:$COMMIT_SHA"